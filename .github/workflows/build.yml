
name: Build ToutiMaroc APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and build
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir unpack
          unzip -q "$ZIP" -d unpack
          cd unpack/touti_fix
          gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ToutiMaroc-APK
          path: unpack/touti_fix/app/build/outputs/apk/debug/app-debug.apk
